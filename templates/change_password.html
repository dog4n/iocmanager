{% extends "base.html" %}
{% block title %}Sifre Degistir — IoCManager{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Sifre Degistir</h1>
  <p>Mevcut sifrenizi dogrulayin ve yeni sifre belirleyin</p>
</div>

<div style="max-width:420px;">
  <div class="card">
    <div class="card-body">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
          <label>Mevcut Sifre</label>
          <input type="password" name="current_password" required placeholder="mevcut sifreniz">
        </div>
        <div class="form-group">
          <label>Yeni Sifre <span style="color:var(--text-muted);">(min. 8 karakter)</span></label>
          <input type="password" name="new_password" required placeholder="yeni sifre">
        </div>
        <div class="form-group">
          <label>Yeni Sifre (Tekrar)</label>
          <input type="password" name="confirm_password" required placeholder="yeni sifre tekrar">
        </div>
        <div style="display:flex; gap:10px; margin-top:6px;">
          <button type="submit" class="btn btn-primary">Sifreyi Degistir</button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Iptal</a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
